<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Anvellis</title>

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23681121'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="CSS/style.css">
</head>

<body data-pagina="cadastro">
  <main class="centro">
    <form class="cartao-cadastro" id="form-cadastro" data-acao="cadastro" novalidate>
      <div class="logo" role="img" aria-label="Anvellis">
        <span class="logo__script" aria-hidden="true">the</span>
        <span class="logo__nome" aria-hidden="true">ANVELLIS</span>
      </div>
      <h1>Criar conta</h1>

      <div class="campo">
        <label class="campo__rotulo" for="cad-nome">Nome completo</label>
        <input class="campo__entrada" id="cad-nome" name="nome" type="text" placeholder="Seu nome" autocomplete="name"
          required minlength="2" data-msg-obrigatorio="Informe seu nome completo."
          data-msg-minimo="Informe seu nome completo." aria-describedby="cad-nome-erro">
        <p class="campo__erro" id="cad-nome-erro" hidden></p>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="cad-email">E-mail</label>
        <input class="campo__entrada" id="cad-email" name="email" type="email" placeholder="seuemail@anvellis.com"
          autocomplete="email" required data-msg-obrigatorio="Informe seu e-mail."
          data-msg-email="Informe um e-mail válido." aria-describedby="cad-email-erro">
        <p class="campo__erro" id="cad-email-erro" hidden></p>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="cad-senha">Senha</label>
        <input class="campo__entrada" id="cad-senha" name="senha" type="password" placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password" required minlength="6" data-msg-obrigatorio="Crie uma senha."
          data-msg-minimo="A senha precisa ter pelo menos 6 caracteres." aria-describedby="cad-senha-erro">
        <p class="campo__erro" id="cad-senha-erro" hidden></p>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="cad-confirmar">Confirmar senha</label>
        <input class="campo__entrada" id="cad-confirmar" name="confirmar" type="password" placeholder="Repita a senha"
          autocomplete="new-password" required data-igual-a="senha" data-msg-obrigatorio="Repita a senha."
          data-msg-igual="As senhas não são iguais." aria-describedby="cad-confirmar-erro">
        <p class="campo__erro" id="cad-confirmar-erro" hidden></p>
      </div>

      <button class="btn btn--primary btn--bloco" type="submit" data-texto-ocupado="Criando conta…">Criar conta</button>
      <p class="cartao-cadastro__rodape">Já possui uma conta? <a href="index.html">Entrar</a></p>
    </form>
  </main>


  <div class="modal-overlay" id="modal-conta-criada" hidden>
    <form class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-conta-criada-titulo" novalidate
      data-ao-fechar="dashboard.html">
      <header class="modal__cabecalho">
        <div class="modal__icone modal__icone--sucesso" aria-hidden="true">✓</div>
        <h2 class="modal__titulo" id="modal-conta-criada-titulo">Conta criada com sucesso</h2>
        <p class="modal__subtitulo">Seu cadastro foi concluído. Você já pode acessar o sistema da Anvellis.</p>
      </header>
      <p class="modal__alerta" role="alert" hidden></p>
      <footer class="modal__rodape">
        <button class="btn btn--primary" type="button" data-fechar>Continuar</button>
      </footer>
    </form>
  </div>

  <div class="modal-overlay" id="modal-erro-servidor" hidden>
    <form class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-erro-servidor-titulo" novalidate>
      <header class="modal__cabecalho">
        <div class="modal__icone modal__icone--alerta" aria-hidden="true">!</div>
        <h2 class="modal__titulo" id="modal-erro-servidor-titulo" data-campo="titulo"></h2>
        <p class="modal__subtitulo" data-campo="mensagem"></p>
      </header>
      <p class="modal__alerta" role="alert" hidden></p>
      <footer class="modal__rodape">
        <button class="btn btn--primary" type="button" data-fechar>Fechar</button>
      </footer>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <noscript>Este sistema precisa de JavaScript para funcionar.</noscript>
  <script src="JS/api.js"></script>
  <script src="JS/app.js"></script>
</body>

</html>
